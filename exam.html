        content="width=device-width, initial-scale=1.0"

    <link rel="stylesheet" href="css/app.css">

</head>

<body>

    <div class="app">

        <aside id="sidebar" class="sidebar">

            <div class="sidebar-header">

                <div class="logo">
                    TEAM
                </div>

                <button
                    id="sidebarToggle"
                    class="sidebar-toggle"
                >
                    ☰
                </button>

            </div>

            <nav class="navigation">

                <a
                    href="home.html"
                    class="nav-item"
                >
                    <span class="nav-icon">🏠</span>
                    <span class="nav-text">Home</span>
                </a>

                <a
                    href="service-manual.html"
                    class="nav-item"
                >
                    <span class="nav-icon">📖</span>
                    <span class="nav-text">Service Manual</span>
                </a>

                <a
                    href="troubleshooting.html"
                    class="nav-item"
                >
                    <span class="nav-icon">🔧</span>
                    <span class="nav-text">Troubleshooting</span>
                </a>

                <a
                    href="exam.html"
                    class="nav-item active"
                >
                    <span class="nav-icon">📝</span>
                    <span class="nav-text">Exam</span>
                </a>

            </nav>

            <div class="sidebar-footer">

                <button
                    id="logoutButton"
                    class="logout-button"
                >
                    <span class="nav-icon">⇥</span>
                    <span class="nav-text">Logout</span>
                </button>

            </div>

        </aside>


        <div
            id="sidebarOverlay"
            class="sidebar-overlay"
        ></div>


        <main class="main-content">

            <header class="topbar">

                <button
                    id="mobileMenuButton"
                    class="mobile-menu-button"
                >
                    ☰
                </button>

                <h1>
                    Exam
                </h1>

            </header>


            <section class="content">

    <div class="welcome-card">

        <h2>
            Exam
        </h2>

        <p>
            Select equipment to view exam answer images.
        </p>

    </div>


    <div
        id="equipmentGrid"
        class="exam-folder-grid"
    >

        <div class="exam-loading">
            Loading...
        </div>

    </div>

</section>

        </main>

    </div>


<script src="js/app.js"></script>


<script>

    /* ========================================
       GOOGLE APPS SCRIPT API
    ======================================== */

    const API_URL =
        "https://script.google.com/macros/s/AKfycbzciz7yky6XqQhksOICETxOBLPMXdAR-Cco3H6QRSqf3QRl26kpI64qTBRJvriFNr-E/exec";


    /* ========================================
       LOAD EXAM FOLDERS
    ======================================== */

    async function loadExamFolders() {

        const grid =
            document.getElementById(
                "equipmentGrid"
            );


        try {

            const response =
                await fetch(
                    API_URL +
                    "?action=examFolders"
                );


            const folders =
                await response.json();


            displayExamFolders(
                folders
            );


        } catch (error) {

            console.error(
                "Error loading exam folders:",
                error
            );


            grid.innerHTML = `
                <div class="exam-loading">
                    ไม่สามารถโหลดข้อมูลได้
                </div>
            `;

        }

    }


    /* ========================================
       DISPLAY FOLDERS
    ======================================== */

    function displayExamFolders(
        folders
    ) {

        const grid =
            document.getElementById(
                "equipmentGrid"
            );


        grid.innerHTML = "";


        folders.forEach(
            folder => {

                const card =
                    document.createElement(
                        "button"
                    );


                card.className =
                    "exam-folder-card";


                card.innerHTML = `

                    <div
                        class="exam-folder-icon"
                    >
                        📁
                    </div>

                    <div
                        class="exam-folder-name"
                    >
                        ${folder.name}
                    </div>

                `;


                grid.appendChild(
                    card
                );

            }
        );

    }


    /* ========================================
       START
    ======================================== */

    loadExamFolders();

</script>

</body>
</html>
