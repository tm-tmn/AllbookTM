<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Team Website - Home</title>

    <link rel="stylesheet" href="css/app.css">

</head>


<body>

    <div class="app">

        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">

            <div class="sidebar-header">

                <div class="logo">
                    TEAM
                </div>

                <button
                    id="sidebarToggle"
                    class="sidebar-toggle"
                    aria-label="Toggle navigation"
                >
                    ☰
                </button>

            </div>


            <!-- Navigation -->
            <nav class="navigation">

                <a
                    href="home.html"
                    class="nav-item active"
                >

                    <span class="nav-icon">
                        🏠
                    </span>

                    <span class="nav-text">
                        Home
                    </span>

                </a>


                <a
                    href="service-manual.html"
                    class="nav-item"
                >

                    <span class="nav-icon">
                        📖
                    </span>

                    <span class="nav-text">
                        Service Manual
                    </span>

                </a>


                <a
                    href="troubleshooting.html"
                    class="nav-item"
                >

                    <span class="nav-icon">
                        🔧
                    </span>

                    <span class="nav-text">
                        Troubleshooting
                    </span>

                </a>


                <a
                    href="exam.html"
                    class="nav-item"
                >

                    <span class="nav-icon">
                        📝
                    </span>

                    <span class="nav-text">
                        Exam
                    </span>

                </a>

            </nav>


            <!-- Sidebar Footer -->
            <div class="sidebar-footer">

                <button
                    id="logoutButton"
                    class="logout-button"
                >

                    <span class="nav-icon">
                        ⇥
                    </span>

                    <span class="nav-text">
                        Logout
                    </span>

                </button>

            </div>

        </aside>


        <!-- Mobile Overlay -->
        <div
            id="sidebarOverlay"
            class="sidebar-overlay"
        ></div>


        <!-- Main Content -->
        <main class="main-content">

            <header class="topbar">

                <button
                    id="mobileMenuButton"
                    class="mobile-menu-button"
                    aria-label="Open navigation"
                >
                    ☰
                </button>

                <h1>
                    Home
                </h1>

            </header>


            <section class="content">

                <div class="welcome-card">

                    <h2>
                        Welcome to Team Website
                    </h2>

                    <p>
                        Internal website for Team.
                    </p>

                </div>

            </section>

        </main>

    </div>


    <script src="js/app.js"></script>

</body>

</html>
