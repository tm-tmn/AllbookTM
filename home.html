<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Team Website - Home</title>

    <link rel="stylesheet" href="css/home.css">

</head>


<body>

    <div class="app">


        <!-- =========================
             Sidebar
        ========================== -->

        <aside id="sidebar" class="sidebar">

            <div class="sidebar-header">

                <div class="logo">
                    TEAM
                </div>

                <button
                    id="sidebarToggle"
                    class="sidebar-toggle"
                >
                    ☰
                </button>

            </div>


            <nav class="navigation">

                <a href="#" class="nav-item active">

                    <span class="nav-icon">
                        🏠
                    </span>

                    <span class="nav-text">
                        Home
                    </span>

                </a>


                <!--
                เมนูอื่น ๆ จะเพิ่มภายหลัง
                -->

            </nav>


            <div class="sidebar-footer">

                <button
                    id="logoutButton"
                    class="logout-button"
                >

                    <span class="nav-icon">
                        ⇥
                    </span>

                    <span class="nav-text">
                        Logout
                    </span>

                </button>

            </div>

        </aside>


        <!-- =========================
             Main Content
        ========================== -->

        <main class="main-content">

            <header class="topbar">

                <button
                    id="mobileMenuButton"
                    class="mobile-menu-button"
                >
                    ☰
                </button>

                <h1>
                    Home
                </h1>

            </header>


            <section class="content">

                <div class="welcome-card">

                    <h2>
                        Welcome to Team Website
                    </h2>

                    <p>
                        Internal website for Team.
                    </p>

                </div>

            </section>

        </main>

    </div>


    <script src="js/home.js"></script>

</body>

</html>
