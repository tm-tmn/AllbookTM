<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLBOOK TM - Smart Service Documentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon.png">
</head>
<body>

    <main class="login-page">
        <div class="grid-pattern"></div>
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>
        <section class="welcome-box">
            <div class="logo-container">
                <span class="logo-text">ALLB</span>
                <div class="book-icon-wrapper">
                    <svg class="book-layer layer-1" viewBox="0 0 64 48" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 36C12 36 28 32 32 38C36 32 52 36 60 36V12C52 12 36 8 32 14C28 8 12 12 4 12V36Z"/>
                        <path d="M32 14V38"/>
                    </svg>
                    <svg class="book-layer layer-2" viewBox="0 0 64 48" fill="none" stroke="#818cf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 36C12 36 28 32 32 38C36 32 52 36 60 36V12C52 12 36 8 32 14C28 8 12 12 4 12V36Z"/>
                        <path d="M32 14V38"/>
                    </svg>
                    <svg class="book-layer layer-3" viewBox="0 0 64 48" fill="none" stroke="#e879f9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 36C12 36 28 32 32 38C36 32 52 36 60 36V12C52 12 36 8 32 14C28 8 12 12 4 12V36Z"/>
                        <path d="M32 14V38"/>
                    </svg>
                    <div class="tm-badge">TM</div>
                </div>
                <span class="logo-text">K</span>
            </div>

            <p class="subtitle">SMART SERVICE DOCUMENTATION</p>

            <button id="enterButton" class="btn-primary">
                <span>Get Started</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </section>
    </main>

    <div id="loginModal" class="modal">
        <div class="login-box">
            <button id="closeButton" class="close-button" aria-label="Close">&times;</button>
            
            <div class="modal-header">
                <h2>Authentication</h2>
                <p>Enter passkey to access workspace</p>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="••••••••" 
                        autocomplete="off"
                    >
                </div>
            </div>

            <p id="loginError" class="login-error"></p>

            <button id="loginButton" class="login-button">
                Unlock Workspace
            </button>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
