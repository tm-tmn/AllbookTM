<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allbook TM - Glowing Neon Code Logo Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0B0F17;
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Subtle Background Grid */
        .bg-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            pointer-events: none;
        }

        .showcase-card {
            position: relative;
            z-index: 2;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 24px;
            padding: 60px 80px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(56, 189, 248, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        /* Brand Title Layout */
        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .logo-text {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: -1.5px;
            color: #FFFFFF;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            line-height: 1;
            display: flex;
            align-items: center;
        }

        /* Infinity Book SVG Glow */
        .infinity-book-svg {
            height: 56px;
            width: auto;
            margin: 0 4px;
            filter: drop-shadow(0 0 12px #38BDF8) drop-shadow(0 0 25px rgba(99, 102, 241, 0.6));
        }

        /* Neon Blue TM Badge */
        .tm-badge {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(99, 102, 241, 0.25));
            border: 1.5px solid #38BDF8;
            color: #38BDF8;
            font-size: 22px;
            font-weight: 900;
            padding: 4px 14px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), inset 0 0 10px rgba(56, 189, 248, 0.2);
            text-shadow: 0 0 8px #38BDF8;
            letter-spacing: 1px;
            transform: translateY(-16px);
        }

        .sub-text {
            font-size: 14px;
            font-weight: 800;
            color: #818CF8;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: -10px;
        }

        /* Preview Info Tag */
        .info-tag {
            position: relative;
            z-index: 2;
            margin-top: 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94A3B8;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="showcase-card">
        <div class="logo-wrapper">
            <!-- ALL Part -->
            <span class="logo-text">ALLB</span>

            <!-- Infinity Book Symbol (Replaces "OO") -->
            <svg class="infinity-book-svg" viewBox="0 0 160 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#38BDF8" />
                        <stop offset="50%" stop-color="#818CF8" />
                        <stop offset="100%" stop-color="#06B6D4" />
                    </linearGradient>
                </defs>
                <!-- Infinity Loop Path -->
                <path d="M 40 40 C 15 40, 10 15, 40 15 C 65 15, 95 65, 120 65 C 145 65, 150 40, 120 40 C 95 40, 65 15, 40 15 C 15 15, 10 40, 40 40 Z" 
                      fill="none" stroke="url(#neonGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Center Book Spine Line -->
                <path d="M 80 20 L 80 60" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
            </svg>

            <!-- K Part -->
            <span class="logo-text">K</span>

            <!-- Neon Blue TM Badge -->
            <span class="tm-badge">TM</span>
        </div>

        <span class="sub-text">Technical & Field Service Management</span>
    </div>

    <div class="info-tag">Concept 2: Glowing Neon Code Showcase</div>

</body>
</html>
