<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allbook TM - The Double-O Book Logo Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0B0F17;
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Ambient Background Grid */
        .bg-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            pointer-events: none;
        }

        .showcase-card {
            position: relative;
            z-index: 2;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 24px;
            padding: 60px 80px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(168, 85, 247, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        /* Brand Title Layout */
        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .logo-text {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: -1.5px;
            color: #FFFFFF;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            line-height: 1;
        }

        /* Double-O Overlapping Book SVG */
        .double-o-svg {
            height: 72px;
            width: auto;
            margin: 0 -4px;
            filter: drop-shadow(0 0 14px rgba(168, 85, 247, 0.6)) drop-shadow(0 0 25px rgba(56, 189, 248, 0.4));
        }

        .sub-text {
            font-size: 14px;
            font-weight: 800;
            color: #A855F7;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: -10px;
        }

        /* Preview Info Tag */
        .info-tag {
            position: relative;
            z-index: 2;
            margin-top: 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94A3B8;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="showcase-card">
        <div class="logo-wrapper">
            <!-- ALLB Part -->
            <span class="logo-text">ALLB</span>

            <!-- Double-O Overlapping Open Books with Hidden TM -->
            <svg class="double-o-svg" viewBox="0 0 220 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bookLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#38BDF8" />
                        <stop offset="100%" stop-color="#6366F1" />
                    </linearGradient>
                    <linearGradient id="bookRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#A855F7" />
                        <stop offset="100%" stop-color="#EC4899" />
                    </linearGradient>
                </defs>

                <!-- Left Book (First O) -->
                <path d="M 25 25 C 45 15, 75 15, 85 25 L 85 75 C 75 65, 45 65, 25 75 Z" 
                      fill="none" stroke="url(#bookLeftGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 85 25 C 95 15, 125 15, 145 25 L 145 75 C 125 65, 95 65, 85 75 Z" 
                      fill="none" stroke="url(#bookLeftGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

                <!-- Right Book (Second O - Overlapping) -->
                <path d="M 75 25 C 95 15, 125 15, 135 25 L 135 75 C 125 65, 95 65, 75 75 Z" 
                      fill="none" stroke="url(#bookRightGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
                <path d="M 135 25 C 145 15, 175 15, 195 25 L 195 75 C 175 65, 145 65, 135 75 Z" 
                      fill="none" stroke="url(#bookRightGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

                <!-- Center Embedded TM Badge (Between Overlapping Area) -->
                <g transform="translate(100, 42)">
                    <rect x="-16" y="-12" width="32" height="24" rx="6" fill="#0B0F17" stroke="#38BDF8" stroke-width="2"/>
                    <text x="0" y="5" fill="#38BDF8" font-size="13" font-weight="900" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif">TM</text>
                </g>
            </svg>

            <!-- K Part -->
            <span class="logo-text">K</span>
        </div>

        <span class="sub-text">Smart Service Documentation</span>
    </div>

    <div class="info-tag">Concept 21: The Double-O Book Showcase</div>

</body>
</html>
