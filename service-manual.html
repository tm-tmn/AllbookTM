<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Manual</title>
    <!-- Font Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/service-manual.css">
</head>

<body>

    <div class="app">

        <!-- Background Ambient Glow -->
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>

        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">AllbookTM</div>
                <button id="sidebarToggle" class="sidebar-toggle">☰</button>
            </div>

            <nav class="navigation">
                <a href="home.html" class="nav-item">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-text">Home</span>
                </a>
                <a href="service-manual.html" class="nav-item active">
                    <span class="nav-icon">📖</span>
                    <span class="nav-text">Service Manual</span>
                </a>
                <a href="troubleshooting.html" class="nav-item">
                    <span class="nav-icon">🔧</span>
                    <span class="nav-text">Troubleshooting</span>
                </a>
                <a href="exam.html" class="nav-item">
                    <span class="nav-icon">📝</span>
                    <span class="nav-text">Exam</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button id="logoutButton" class="logout-button">
                    <span class="nav-icon">⇥</span>
                    <span class="nav-text">Logout</span>
                </button>
            </div>
        </aside>

        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <main class="main-content">

            <section class="content">
        
                <!-- Header Card -->
                <div class="welcome-card" id="welcomeCard">
                    <div class="welcome-card-header">
                        <button id="mobileMenuButton" class="mobile-menu-button">☰</button>
        
                        <div class="welcome-card-text">
                            <h2 id="manualTitleHeader">Service Manual</h2>
                            <p id="manualSubtitle">Select an equipment category to view service manuals & documents.</p>
                        </div>
        
                        <div id="manualActionContainer"></div>
                    </div>
                </div>
        
                <!-- Grid Container สำหรับแสดง Folder และไฟล์ PDF -->
                <div id="manualGrid" class="manual-grid">
                    <div class="manual-loading">Loading service manuals...</div>
                </div>
        
            </section>
        
        </main>

    </div>

    <!-- Modal สำหรับดูไฟล์ PDF แบบ Interactive -->
    <div id="pdfModal" class="pdf-modal">
        <div class="pdf-modal-container">
            <div class="pdf-modal-header">
                <div class="pdf-title-group">
                    <span class="pdf-badge">PDF DOCUMENT</span>
                    <h3 id="pdfModalTitle">Document Viewer</h3>
                </div>
                <div class="pdf-modal-actions">
                    <a id="pdfOpenNewTabBtn" href="#" target="_blank" class="pdf-btn" title="Open in new tab">↗ Open</a>
                    <button class="pdf-close-btn" onclick="closePdfModal()">&times;</button>
                </div>
            </div>
            <div class="pdf-modal-body">
                <iframe id="pdfIframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- External JavaScript Files -->
    <script src="js/app.js"></script>
    <script src="js/service-manual.js"></script>

</body>

</html>
