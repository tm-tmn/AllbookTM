<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLBOOK TM - Smart Service Documentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/service-manual.css">

    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon.png">
</head>
<body>
    <div class="app">

        <!-- Ambient Glow Background -->
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>

        <!-- Sidebar (แก้ไขโครงสร้างแท็กให้ถูกต้องตรงกับ app.css) -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    AllbookTM
                </div>
                <button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle navigation">
                    ☰
                </button>
            </div>

            <nav class="navigation">
                <a href="home.html" class="nav-item">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-text">Home</span>
                </a>
                <a href="service-manual.html" class="nav-item active">
                    <span class="nav-icon">📖</span>
                    <span class="nav-text">Service Manual</span>
                </a>
                <a href="troubleshooting.html" class="nav-item">
                    <span class="nav-icon">🔧</span>
                    <span class="nav-text">Troubleshooting</span>
                </a>
                <a href="exam.html" class="nav-item">
                    <span class="nav-icon">📝</span>
                    <span class="nav-text">Exam</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button id="logoutButton" class="logout-button">
                    <span class="nav-icon">⇥</span>
                    <span class="nav-text">Logout</span>
                </button>
            </div>
        </aside>

        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <main class="main-content">
            <section class="content">
                <div class="welcome-card" id="welcomeCard">
                    <div class="welcome-card-header">
                        <button id="mobileMenuButton" class="mobile-menu-button">☰</button>
        
                        <div class="welcome-card-text">
                            <h2 id="manualTitleHeader">Service Manual</h2>
                            <p id="manualSubtitle">Select equipment to view manuals and documents.</p>
                        </div>
        
                        <div id="manualActionContainer"></div>
                    </div>
                </div>
        
                <!-- Container แสดงโฟลเดอร์และไฟล์ Manual -->
                <div id="manualGrid" class="manual-grid">
                    <div class="manual-loading">Loading manuals...</div>
                </div>
            </section>
        </main>
    </div>

    <!-- PDF Modal Viewer -->
    <div id="pdfModal" class="pdf-modal">
        <div class="pdf-modal-container">
            <div class="pdf-modal-header">
                <div class="pdf-title-group">
                    <span class="pdf-badge">PDF</span>
                    <h3 id="pdfModalTitle">Document Viewer</h3>
                </div>
                <div class="pdf-modal-actions">
                    <a id="pdfDownloadBtn" href="#" target="_blank" download class="pdf-btn">Download</a>
                    <button id="closePdfModal" class="pdf-close-btn">&times;</button>
                </div>
            </div>
            <div class="pdf-modal-body">
                <iframe id="pdfFrame" src="" frameborder="0"></iframe>
            </div>
        </div>
    </div>

    <!-- External JavaScript Files -->
    <script src="js/app.js"></script>
    <script src="js/service-manual.js"></script>

</body>
</html>
