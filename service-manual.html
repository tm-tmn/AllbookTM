<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Manual</title>
    <!-- Font Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/service-manual.css">
</head>

<body>

    <div class="app">

        <!-- Background Ambient Glow -->
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>

        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">AllbookTM</div>
                <button id="sidebarToggle" class="sidebar-toggle">☰</button>
            </div>

            <nav class="navigation">
                <a href="home.html" class="nav-item">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-text">Home</span>
                </a>
                <a href="service-manual.html" class="nav-item active">
                    <span class="nav-icon">📖</span>
                    <span class="nav-text">Service Manual</span>
                </a>
                <a href="troubleshooting.html" class="nav-item">
                    <span class="nav-icon">🔧</span>
                    <span class="nav-text">Troubleshooting</span>
                </a>
                <a href="exam.html" class="nav-item">
                    <span class="nav-icon">📝</span>
                    <span class="nav-text">Exam</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button id="logoutButton" class="logout-button">
                    <span class="nav-icon">⇥</span>
                    <span class="nav-text">Logout</span>
                </button>
            </div>
        </aside>

        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <main class="main-content">

            <section class="content">
        
                <!-- Header Card -->
                <div class="welcome-card" id="welcomeCard">
                    <div class="welcome-card-header">
                        <button id="mobileMenuButton" class="mobile-menu-button">☰</button>
        
                        <div class="welcome-card-text">
                            <h2 id="manualTitleHeader">Service Manual</h2>
                            <p id="manualSubtitle">Select an equipment category to view service manuals & documents.</p>
                        </div>
        
                        <div id="manualActionContainer"></div>
                    </div>
                </div>
        
                <!-- Grid Container สำหรับแสดง Folder และไฟล์ PDF -->
                <div id="manualGrid" class="manual-grid">
                    <div class="manual-loading">Loading service manuals...</div>
                </div>
        
            </section>
        
        </main>

    </div>

    <!-- PDF Modal -->
    <div id="pdfModal" class="pdf-modal">
        <!-- 1. เปลี่ยนเป็น pdf-modal-container เพื่อให้ได้ความกว้างเต็มตาม CSS -->
        <div class="pdf-modal-container">
            <div class="pdf-modal-header">
                <!-- 2. ปรับ class ให้ตรงกับ CSS (pdf-title-group และ pdf-badge) -->
                <div class="pdf-title-group">
                    <span class="pdf-badge">PDF DOCUMENT</span>
                    <h3 id="pdfModalTitle">Document Title</h3>
                </div>
                
                <div class="pdf-modal-actions">
                    <!-- ช่อง Search ภายในเอกสาร PDF -->
                    <div class="pdf-search-box">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                        <input type="text" id="pdfSearchInput" placeholder="ค้นหาในเอกสาร..." onkeyup="handlePdfSearch(event)">
                    </div>

                    <!-- ปุ่มปิด Modal -->
                    <button class="pdf-close-btn" onclick="closePdfModal()" title="Close">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="pdf-modal-body">
                <iframe id="pdfIframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- External JavaScript Files -->
    <script src="js/app.js"></script>
    <script src="js/service-manual.js"></script>

</body>

</html>
