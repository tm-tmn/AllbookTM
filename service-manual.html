<body>

    <div class="app">

        <!-- Ambient Glow Background -->
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>

        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">AllBookTM</div>
                <button id="sidebarToggle" class="sidebar-toggle">☰</button>
            </div>

            <nav class="navigation">
                <a href="home.html" class="nav-item">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-text">Home</span>
                </a>
                <a href="service-manual.html" class="nav-item active">
                    <span class="nav-icon">📖</span>
                    <span class="nav-text">Service Manual</span>
                </a>
                <a href="troubleshooting.html" class="nav-item">

                    <span class="nav-text">Troubleshooting</span>

                <a href="exam.html" class="nav-item">

            <section class="content">

                    <div class="welcome-card-header">

                        <div id="actionContainer"></div>
                    </div>
                </div>
        
                <!-- Container สำหรับแสดงโฟลเดอร์และไฟล์ Manual -->
                <div id="equipmentGrid" class="exam-folder-grid">
                    <div class="exam-loading">Loading manuals...</div>
                </div>

        </main>

    <!-- External JavaScript Files -->
